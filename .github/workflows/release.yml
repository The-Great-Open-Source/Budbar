name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build
        run: scripts/release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "${GITHUB_REF_NAME}" in v0.*) FLAGS="--prerelease" ;; esac
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS="--notes-file $NOTES"
          else
            NOTES_ARGS="--generate-notes"
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Budbar ${GITHUB_REF_NAME}" \
            $NOTES_ARGS $FLAGS
